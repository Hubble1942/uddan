<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4e89" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Uddan</title>
  </head>
  <body>
    <div id="map"></div>

    <section id="readout" aria-live="polite">
      <div><span class="label">Altitude</span><span id="altitude">–</span></div>
      <div><span class="label">Above ground</span><span id="height-above-ground">–</span></div>
      <div><span class="label">Speed</span><span id="ground-speed">–</span></div>
      <div id="no-gps" hidden>NO GPS</div>
    </section>

    <section id="replay-panel" aria-label="Replay" hidden>
      <div class="row">
        <label class="button" title="Select IGC file">IGC file…<input id="replay-file" type="file" accept=".igc,.IGC" hidden /></label>
        <button id="replay-play" type="button" title="Play" disabled>▶</button>
        <div id="replay-speed" class="segmented" role="group" aria-label="Replay speed">
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="4" aria-pressed="false">4×</button>
          <button type="button" data-speed="16" aria-pressed="false">16×</button>
        </div>
      </div>
      <div id="replay-file-name" class="hint">No IGC file selected</div>
      <input id="replay-timeline" type="range" min="0" max="0" step="1000" value="0" aria-label="Replay time" disabled />
      <div class="replay-times"><span id="replay-elapsed">0:00:00</span><span id="replay-total">0:00:00</span></div>
    </section>

    <div id="buttons">
      <button id="recenter" type="button" title="Back to my position" hidden>◎</button>
      <button id="open-menu" type="button" title="Menu">☰</button>
    </div>

    <dialog id="menu">
      <form method="dialog" class="menu-header">
        <h1>Uddan</h1>
        <button type="submit" title="Close">✕</button>
      </form>

      <section>
        <h2>Position</h2>
        <div class="segmented" role="group" aria-label="Position mode">
          <button id="mode-live" type="button" aria-pressed="true">Live</button>
          <button id="mode-replay" type="button" aria-pressed="false">Replay</button>
        </div>
        <p id="position-status" class="hint"></p>
      </section>

      <section>
        <h2>Airspace</h2>
        <ul id="airspace-files" class="list"></ul>
        <label class="button">Load OpenAIR file…<input id="airspace-file" type="file" accept=".txt,.air,.openair" hidden multiple /></label>
        <p id="airspace-warnings" class="hint"></p>
        <h3>Visible classes</h3>
        <div id="airspace-classes" class="chips"></div>
        <label>Vertical Margin (m) <input id="vertical-margin" type="number" min="0" max="1000" step="10" /></label>
      </section>

      <section>
        <h2>Flights</h2>
        <button id="stop-flight" type="button" hidden>End current Flight</button>
        <ul id="flight-list" class="list"></ul>
      </section>

      <section>
        <h2>Pilot</h2>
        <label>Name <input id="pilot-name" type="text" autocomplete="name" /></label>
        <label>Glider <input id="glider" type="text" /></label>
      </section>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
